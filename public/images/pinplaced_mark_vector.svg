<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- PinPlaced Standalone Monogram Mark -->
  <g fill="currentColor" fill-rule="evenodd">
    <!-- 'P' outer shape -->
    <path d="M 140 80 
             L 280 80 
             C 370 80, 370 260, 280 260 
             L 210 260 
             L 210 420 
             L 140 420 
             Z 
             M 210 130 
             L 270 130 
             C 315 130, 315 210, 270 210 
             L 210 210 
             Z" />
    <!-- Negative space: flagpole and flag -->
    <rect x="198" y="110" width="12" height="290" rx="6" fill="#FFFFFF" />
    <path d="M 210 120 
             Q 255 108, 290 125 
             C 320 138, 320 182, 290 192 
             Q 255 202, 210 192 
             Z" 
          fill="#FFFFFF" />
  </g>
</svg>