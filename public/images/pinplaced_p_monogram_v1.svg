<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- PinPlaced "P" Monogram Shirt Icon - Concept 1 (Black on Transparent) -->
  <g fill="#000000" stroke="none">
    <!-- Pin Flagstick (Vertical stem of the P) -->
    <rect x="180" y="80" width="22" height="320" rx="11" />
    <circle cx="191" cy="74" r="13" />

    <!-- Flag as the Bowl of the "P" -->
    <path d="M 195 85 
             L 290 85 
             C 365 85, 365 245, 290 245 
             L 195 245 
             Z 
             M 202 120 
             L 280 120 
             C 325 120, 325 210, 280 210 
             L 202 210 
             Z" 
          fill-rule="evenodd" />

    <!-- Putting Cup at Base -->
    <ellipse cx="191" cy="400" rx="65" ry="20" />
  </g>
  
  <!-- Inner Cup Cutout for depth -->
  <ellipse cx="191" cy="400" rx="36" ry="10" fill="#FFFFFF" />
  <rect x="184" y="380" width="14" height="20" fill="#000000" />
</svg>

