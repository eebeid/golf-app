<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Minimalist Luxury 'P' Pin Emblem -->
  <rect width="500" height="500" fill="#FFFFFF" />
  <g transform="translate(50, 50)">
    <!-- Clean geometric 'P' with integrated flagpole and waving flag -->
    <path d="M 140 80
             L 260 80
             C 335 80, 335 240, 260 240
             L 200 240
             L 200 360
             L 140 360
             Z" 
          fill="#111827" />
    <!-- Negative space: vertical flagstick cut & flag cutout -->
    <rect x="190" y="98" width="10" height="242" rx="5" fill="#FFFFFF" />
    <path d="M 200 108 
             Q 240 98, 270 114
             C 295 125, 295 165, 270 176
             Q 240 186, 200 176
             Z" 
          fill="#FFFFFF" />
  </g>
</svg>