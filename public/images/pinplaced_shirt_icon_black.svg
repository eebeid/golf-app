<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- PinPlaced Apparel Embroidery & Screen-Print Icon (Black on Transparent) -->
  <g fill="#000000" stroke="none">
    <!-- Flagstick Pin -->
    <rect x="244" y="90" width="12" height="280" rx="6" />
    <circle cx="250" cy="88" r="8" />

    <!-- Fluttering Pennant Flag -->
    <path d="M 256 96 
             C 290 102, 325 90, 360 106 
             C 345 125, 330 145, 355 162 
             C 320 148, 285 158, 256 150 
             Z" />

    <!-- Putting Cup / Hole at Base -->
    <ellipse cx="250" cy="365" rx="64" ry="24" />
  </g>
  
  <!-- Putting Cup Inner Depth (Transparent Cutout) -->
  <ellipse cx="250" cy="365" rx="34" ry="12" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Sweeping Trajectory Orbit Ring -->
  <path d="M 120 280 
           C 150 200, 330 180, 395 240 
           C 415 260, 380 290, 330 315 
           C 270 345, 170 350, 130 320 
           C 105 300, 105 290, 120 280 Z" 
        fill="none" 
        stroke="#000000" 
        stroke-width="16" 
        stroke-linecap="round" />
  
  <!-- Accent Inner Arc -->
  <path d="M 145 275 
           C 175 220, 310 205, 365 248" 
        fill="none" 
        stroke="#000000" 
        stroke-width="6" 
        stroke-linecap="round" />
</svg>
