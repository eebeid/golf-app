<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- PinPlaced "P" Flag Icon - Concept 2 (Dynamic Flutter P) -->
  <g fill="#000000" stroke="none">
    <!-- Flagstick Pin (Vertical spine of the P) -->
    <rect x="175" y="70" width="20" height="340" rx="10" />
    <circle cx="185" cy="65" r="14" />

    <!-- Dynamic Fluttering Flag forming the P -->
    <path d="M 195 78 
             Q 250 68, 305 82 
             C 380 102, 380 230, 305 250 
             Q 250 264, 195 254 
             Z 
             M 195 118 
             Q 245 110, 290 120 
             C 335 135, 335 200, 290 212 
             Q 245 222, 195 214 
             Z" 
          fill-rule="evenodd" />

    <!-- Putting Cup at Base -->
    <ellipse cx="185" cy="410" rx="70" ry="22" />
    
    <!-- Golf Ball perched on lip of cup -->
    <circle cx="280" cy="405" r="18" />
  </g>
  
  <!-- Inner Cup Cutout -->
  <ellipse cx="185" cy="410" rx="42" ry="11" fill="#FFFFFF" />
  <rect x="177" y="390" width="16" height="20" fill="#000000" />
</svg>

